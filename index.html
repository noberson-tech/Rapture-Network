<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, rgba(10, 14, 20, 0.72), rgba(10, 14, 20, 0.92)),
                        url('https://cdn.discordapp.com/attachments/1527798078663426058/1536942973026304000/C22QN.jpg?ex=6a8088ef&is=6a7f376f&hm=8cc7c5118454da6f490e7de5505f25b1f7d180f9c88d8c21280029980a56f3c7') center/cover no-repeat fixed;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            background: rgba(22, 25, 32, 0.85);
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: center;
            gap: 3rem;
            align-items: center;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .nav-item:hover {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            transform: scale(1.05);
        }

        .nav-icon {
            font-size: 1.2rem;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 60vh;
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .hero-stats-left,
        .hero-stats-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, rgba(0, 184, 212, 0.05) 100%);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            padding: 2rem;
            text-align: left;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.15), transparent);
            transition: left 0.5s ease;
        }

        .stat-box:hover::before {
            left: 100%;
        }

        .stat-box:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6));
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .stat-description {
            font-size: 0.85rem;
            color: #00d4ff;
            font-weight: 500;
        }

        .hero-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .logo {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
            display: block;
            filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8)) 
                    drop-shadow(0 0 60px rgba(0, 240, 255, 0.4));
            animation: logoGlow 3s ease-in-out infinite;
            object-fit: contain;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8)) 
                        drop-shadow(0 0 60px rgba(0, 240, 255, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(0, 240, 255, 1)) 
                        drop-shadow(0 0 100px rgba(0, 240, 255, 0.6));
            }
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00f0ff 0%, #00b8d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(0, 240, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* IP Copy Box */
        .ip-box {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, rgba(0, 184, 212, 0.05) 100%);
            border: 2px solid #00f0ff;
            border-radius: 8px;
            padding: 1.5rem 2rem;
            max-width: 400px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.05);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .ip-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .ip-box:hover::before {
            left: 100%;
        }

        .ip-box:hover {
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.1);
            transform: scale(1.05);
            border-color: #00ffff;
        }

        .ip-label {
            font-size: 0.85rem;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .ip-address {
            font-size: 1.4rem;
            font-family: 'Courier New', monospace;
            color: #00f0ff;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .copy-hint {
            font-size: 0.75rem;
            color: rgba(0, 240, 255, 0.6);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00f0ff 0%, #00b8d4 100%);
            color: #0a0e14;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s;
            pointer-events: none;
            z-index: 2000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .hero {
                flex-direction: column;
                min-height: auto;
                gap: 3rem;
            }

            .hero-stats-left,
            .hero-stats-right {
                width: 100%;
            }

            .logo {
                width: 150px;
                height: 150px;
            }

            .hero-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                gap: 1rem;
                padding: 0 1rem;
            }

            .nav-item {
                font-size: 0.8rem;
                gap: 0.3rem;
            }

            .nav-icon {
                font-size: 1rem;
            }

            .hero {
                padding: 2rem 1rem;
            }

            .stat-box {
                padding: 1.5rem;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .hero-title {
                font-size: 1.5rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .ip-box {
                padding: 1rem 1.5rem;
            }

            .ip-address {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .nav-container {
                gap: 0.5rem;
                flex-wrap: wrap;
            }

            .nav-item {
                font-size: 0.7rem;
            }

            .hero {
                padding: 1.5rem 0.5rem;
                gap: 1.5rem;
            }

            .stat-box {
                padding: 1rem;
            }

            .stat-number {
                font-size: 1.2rem;
            }

            .stat-icon {
                font-size: 2rem;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .hero-title {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }

            .hero-subtitle {
                font-size: 0.9rem;
            }

            .ip-box {
                max-width: 100%;
                padding: 0.8rem 1rem;
            }

            .ip-address {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    <!-- JavaScript for Copy to Clipboard -->
    <script>
        function copyToClipboard() {
            const ipAddress = 'spire-java.playit.plus';
            
            const textarea = document.createElement('textarea');
            textarea.value = ipAddress;
            document.body.appendChild(textarea);
            
            textarea.select();
            document.execCommand('copy');
            
            document.body.removeChild(textarea);
            showCopyNotification();
        }

        function showCopyNotification() {
            const existing = document.querySelector('.copy-notification');
            if (existing) {
                existing.remove();
            }

            const notification = document.createElement('div');
            notification.className = 'copy-notification';
            notification.textContent = '✓ Copied to clipboard!';
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'c' && !e.ctrlKey && !e.metaKey) {
                if (document.activeElement.tagName !== 'INPUT' && 
                    document.activeElement.tagName !== 'TEXTAREA') {
                    copyToClipboard();
                }
            }
        });
    </script>
